[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
solc = "0.8.37"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read-write", path = "./proposals" }]

[invariant]
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
