[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
solc = "0.8.37"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read-write", path = "./proposals" }, { access = "read", path = "./test/fixtures" }, { access = "read", path = "./galleries" }]

[invariant]
fail_on_revert = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
